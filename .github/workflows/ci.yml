name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      GEMINI_API_KEY: ci-dummy
      GROQ_API_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q
  image:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -t sentinel-api:ci apps/api

      - name: Save the image to a file outside the repo
        run: docker save sentinel-api:ci -o "$RUNNER_TEMP/sentinel-api.tar"
          - name: Trivy scans the image (fail on HIGH or CRITICAL)
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP:/work" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /work/sentinel-api.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

