apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sentinel
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000         # the appuser in the Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.api.image (required "api.tag is required: the commit SHA of a green CI run" .Values.api.tag) | quote }}
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis.sentinel.svc.cluster.local:6379/0
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sentinel
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: sentinel
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
      targetPort: 8000
