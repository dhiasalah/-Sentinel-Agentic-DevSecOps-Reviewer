# Where certificates come from: Let's Encrypt, proving we own the name with HTTP-01 through Traefik.
# Staging = untrusted test certificates with high rate limits; switch ingress.clusterIssuer to prod once it works.
{{- range $name, $server := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    # The ACME account's private key, created by cert-manager on first use.
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
