apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sentinel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the redis user in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}      # the queue is rebuilt from GitHub redeliveries; persistence is a later step
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sentinel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sentinel
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
