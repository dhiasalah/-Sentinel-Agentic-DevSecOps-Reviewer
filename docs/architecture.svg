<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t d">
  <title id="t">Sentinel architecture</title>
  <desc id="d">A pull request on GitHub sends a signed webhook to Traefik and the API on a k3s cluster on an Azure VM. The API queues a job in Redis. The worker runs LangGraph agents: scanners run as sandboxed Kubernetes Jobs, the AI triages through an LLM router traced in Langfuse, a policy layer applies guardrails, and the report is posted as a PR comment. Results go to Supabase and the Next.js dashboard, where a human requests and approves fixes; the worker reads approvals back, verifies the patch in a sandbox and opens a fix PR. Delivery: GitHub Actions tests, Trivy image scan, GHCR, a pinned tag in Git, and ArgoCD sync.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c0531f" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d93"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b47"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #17191e; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; }
      .h { font-size: 15px; font-weight: 600; }
      .s { fill: #62666f; font-size: 11.5px; }
      .zone { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #62666f; font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; }
      .ns { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #8a8d93; font-size: 10.5px; }
      .chip { font-size: 12px; font-weight: 500; }
      .chipi { font-size: 12px; font-weight: 600; fill: #fffefb; }
      .num { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #fffefb; font-size: 11px; font-weight: 700; }
      .lbl { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #17191e; font-size: 10.5px; font-weight: 600; }
      .card { fill: #fffefb; stroke: #17191e; stroke-width: 1; }
      .soft { fill: #fffefb; stroke: #c9c5ba; stroke-width: 1; }
      .flow { fill: none; stroke: #17191e; stroke-width: 1.5; }
      .step { fill: none; stroke: #8a8d93; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="830" fill="#f6f4ee"/>

  <!-- title + legend -->
  <text x="40" y="48" class="mono" font-size="11.5" font-weight="600" letter-spacing="2.4" fill="#1f6b47">SENTINEL · ARCHITECTURE</text>
  <text x="40" y="82" class="serif" font-size="27">From a pull request to a security review, and back</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#17191e"/>
  <g transform="translate(724,42)">
    <rect x="0" y="0" width="16" height="12" fill="url(#hatch)" stroke="#c0531f"/>
    <text x="24" y="10.5" class="s">untrusted input</text>
    <rect x="128" y="0" width="16" height="12" fill="#17191e"/>
    <text x="152" y="10.5" class="s">AI step</text>
    <rect x="214" y="0" width="16" height="12" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="238" y="10.5" class="s">sandboxed</text>
    <line x1="314" y1="6" x2="344" y2="6" class="flow" marker-end="url(#arr)"/>
    <text x="354" y="10.5" class="s">a PR's path</text>
  </g>

  <!-- ================= managed services (left) ================= -->
  <text x="40" y="132" class="zone">MANAGED SERVICES</text>
  <line x1="40" y1="140" x2="236" y2="140" stroke="#dedbd2"/>

  <rect x="48" y="156" width="188" height="80" rx="3" class="card"/>
  <text x="62" y="182" class="h">Langfuse</text>
  <text x="62" y="202" class="s">tokens, cost, fallbacks</text>
  <text x="62" y="220" class="s">sizes only, never code</text>

  <rect x="48" y="286" width="188" height="80" rx="3" fill="#17191e"/>
  <text x="62" y="312" class="h" style="fill:#fffefb">LLM router</text>
  <text x="62" y="332" class="s" style="fill:#c9c5ba">Gemini, then Groq</text>
  <text x="62" y="350" class="s" style="fill:#c9c5ba">≈ $0.004 per PR scan</text>
  <line x1="142" y1="286" x2="142" y2="239" class="step" stroke-dasharray="3 3" marker-end="url(#arrm)"/>
  <text x="150" y="266" class="ns">traces</text>

  <rect x="48" y="396" width="188" height="80" rx="3" class="card"/>
  <text x="62" y="422" class="h">Supabase</text>
  <text x="62" y="442" class="s">Postgres, row-level security</text>
  <text x="62" y="460" class="s">GitHub OAuth</text>

  <rect x="48" y="516" width="188" height="80" rx="3" class="card"/>
  <text x="62" y="542" class="h">Dashboard</text>
  <text x="62" y="562" class="s">Next.js on Vercel</text>
  <text x="62" y="580" class="s">request + approve fixes</text>
  <line x1="110" y1="476" x2="110" y2="513" class="step" marker-end="url(#arrm)"/>
  <line x1="174" y1="516" x2="174" y2="479" class="step" marker-end="url(#arrm)"/>
  <text x="118" y="500" class="ns">read</text>
  <text x="182" y="500" class="ns">approve</text>

  <!-- ================= Azure VM / k3s (centre) ================= -->
  <rect x="282" y="114" width="640" height="516" rx="4" fill="#efece4" stroke="#17191e"/>
  <text x="300" y="138" class="zone" style="fill:#17191e">AZURE VM · K3S</text>
  <text x="904" y="138" class="s" text-anchor="end">Terraform · Helm · ArgoCD</text>

  <!-- namespace sentinel: traffic flows right to left -->
  <rect x="302" y="152" width="600" height="104" rx="3" fill="none" stroke="#b9b5aa" stroke-dasharray="3 3"/>
  <text x="314" y="170" class="ns">namespace sentinel</text>

  <rect x="318" y="180" width="164" height="62" rx="3" class="card"/>
  <text x="332" y="206" class="h">Redis</text>
  <text x="332" y="226" class="s">job queue · BLMOVE</text>

  <rect x="516" y="180" width="170" height="62" rx="3" class="card"/>
  <text x="530" y="206" class="h">API · FastAPI</text>
  <text x="530" y="226" class="s">verify, dedupe, queue</text>

  <rect x="718" y="180" width="168" height="62" rx="3" class="card"/>
  <text x="732" y="206" class="h">Traefik + TLS</text>
  <text x="732" y="226" class="s">cert-manager, HTTPS</text>

  <line x1="718" y1="211" x2="689" y2="211" class="flow" marker-end="url(#arr)"/>
  <line x1="516" y1="211" x2="485" y2="211" class="flow" marker-end="url(#arr)"/>
  <circle cx="500" cy="194" r="9" fill="#17191e"/><text x="500" y="198" class="num" text-anchor="middle">2</text>

  <!-- namespace sentinel-scans -->
  <rect x="302" y="272" width="600" height="344" rx="3" fill="none" stroke="#b9b5aa" stroke-dasharray="3 3"/>
  <text x="890" y="290" class="ns" text-anchor="end">namespace sentinel-scans</text>

  <line x1="400" y1="242" x2="400" y2="297" class="flow" marker-end="url(#arr)"/>
  <circle cx="400" cy="268" r="9" fill="#17191e"/><text x="400" y="272" class="num" text-anchor="middle">3</text>
  <text x="414" y="272" class="lbl">job</text>

  <!-- worker -->
  <rect x="318" y="300" width="568" height="188" rx="3" class="card"/>
  <text x="334" y="326" class="h">Worker · LangGraph agents</text>
  <text x="870" y="326" class="s" text-anchor="end">RBAC: may only create Jobs</text>

  <text x="334" y="352" class="ns">scan graph</text>
  <rect x="334" y="360" width="96" height="36" rx="2" class="soft"/>
  <text x="382" y="383" class="chip" text-anchor="middle">plan</text>
  <rect x="444" y="360" width="96" height="36" rx="2" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="492" y="383" class="chip" text-anchor="middle" style="fill:#1f6b47">4 scanners</text>
  <rect x="554" y="360" width="96" height="36" rx="2" fill="#17191e"/>
  <text x="602" y="383" class="chipi" text-anchor="middle">AI triage</text>
  <rect x="664" y="360" width="96" height="36" rx="2" class="soft"/>
  <text x="712" y="383" class="chip" text-anchor="middle">policy</text>
  <rect x="774" y="360" width="96" height="36" rx="2" fill="#fffefb" stroke="#17191e"/>
  <text x="822" y="383" class="chip" text-anchor="middle" font-weight="600">report</text>
  <line x1="430" y1="378" x2="442" y2="378" class="step" marker-end="url(#arrm)"/>
  <line x1="540" y1="378" x2="552" y2="378" class="step" marker-end="url(#arrm)"/>
  <line x1="650" y1="378" x2="662" y2="378" class="step" marker-end="url(#arrm)"/>
  <line x1="760" y1="378" x2="772" y2="378" class="step" marker-end="url(#arrm)"/>

  <text x="334" y="424" class="ns">fix graph</text>
  <rect x="334" y="432" width="120" height="36" rx="2" fill="#17191e"/>
  <text x="394" y="455" class="chipi" text-anchor="middle">AI fix</text>
  <rect x="470" y="432" width="120" height="36" rx="2" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="530" y="455" class="chip" text-anchor="middle" style="fill:#1f6b47">sandbox verify</text>
  <rect x="606" y="432" width="120" height="36" rx="2" class="soft"/>
  <text x="666" y="455" class="chip" text-anchor="middle">human approval</text>
  <rect x="742" y="432" width="128" height="36" rx="2" fill="#fffefb" stroke="#17191e"/>
  <text x="806" y="455" class="chip" text-anchor="middle" font-weight="600">open fix PR</text>
  <line x1="454" y1="450" x2="468" y2="450" class="step" marker-end="url(#arrm)"/>
  <line x1="590" y1="450" x2="604" y2="450" class="step" marker-end="url(#arrm)"/>
  <line x1="726" y1="450" x2="740" y2="450" class="step" marker-end="url(#arrm)"/>

  <!-- jobs -->
  <line x1="602" y1="488" x2="602" y2="503" class="flow" marker-end="url(#arr)"/>
  <circle cx="584" cy="496" r="9" fill="#17191e"/><text x="584" y="500" class="num" text-anchor="middle">4</text>
  <rect x="318" y="506" width="568" height="98" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="334" y="528" font-size="12" font-weight="600" style="fill:#1f6b47">Kubernetes Jobs · gVisor · read-only code · default-deny network</text>
  <rect x="334" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
  <text x="384" y="562" class="chip mono" text-anchor="middle">semgrep</text>
  <rect x="442" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
  <text x="492" y="562" class="chip mono" text-anchor="middle">trivy</text>
  <rect x="550" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
  <text x="600" y="562" class="chip mono" text-anchor="middle">gitleaks</text>
  <rect x="658" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
  <text x="708" y="562" class="chip mono" text-anchor="middle">checkov</text>
  <rect x="766" y="540" width="104" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
  <text x="818" y="562" class="chip mono" text-anchor="middle">git apply</text>
  <text x="334" y="594" class="s" font-size="11">Semgrep rules and the Trivy DB download: HTTPS out only. Everything else: no network.</text>

  <!-- ================= GitHub (right) ================= -->
  <text x="960" y="132" class="zone">GITHUB</text>
  <line x1="960" y1="140" x2="1160" y2="140" stroke="#dedbd2"/>

  <rect x="968" y="156" width="184" height="62" rx="3" fill="url(#hatch)" stroke="#c0531f"/>
  <rect x="968" y="156" width="184" height="62" rx="3" fill="#fffefb" opacity="0.72"/>
  <text x="982" y="182" class="h">Pull request</text>
  <text x="982" y="202" class="s" style="fill:#9a3f16">untrusted code</text>

  <rect x="968" y="248" width="184" height="62" rx="3" class="card"/>
  <text x="982" y="274" class="h">GitHub App</text>
  <text x="982" y="294" class="s">HMAC-signed webhook</text>
  <line x1="1060" y1="218" x2="1060" y2="245" class="step" marker-end="url(#arrm)"/>

  <rect x="968" y="347" width="184" height="62" rx="3" class="card"/>
  <text x="982" y="373" class="h">PR comment</text>
  <text x="982" y="393" class="s">escaped report, 1 per PR</text>

  <rect x="968" y="419" width="184" height="62" rx="3" class="card"/>
  <text x="982" y="445" class="h">Fix PR</text>
  <text x="982" y="465" class="s">after human approval</text>

  <!-- ================= the PR's path between zones ================= -->
  <!-- 1: webhook into the cluster -->
  <path d="M968,279 L938,279 L938,211 L889,211" class="flow" marker-end="url(#arr)"/>
  <circle cx="938" cy="245" r="9" fill="#17191e"/><text x="938" y="249" class="num" text-anchor="middle">1</text>
  <!-- 5: AI calls -->
  <line x1="318" y1="330" x2="239" y2="330" class="flow" marker-end="url(#arr)"/>
  <circle cx="278" cy="330" r="9" fill="#17191e"/><text x="278" y="334" class="num" text-anchor="middle">5</text>
  <text x="278" y="314" class="lbl" text-anchor="middle">AI calls</text>
  <!-- 6: report becomes the PR comment -->
  <line x1="870" y1="378" x2="965" y2="378" class="flow" marker-end="url(#arr)"/>
  <circle cx="928" cy="378" r="9" fill="#17191e"/><text x="928" y="382" class="num" text-anchor="middle">6</text>
  <!-- 7: results out, approvals back -->
  <line x1="318" y1="420" x2="239" y2="420" class="flow" marker-end="url(#arr)"/>
  <circle cx="278" cy="420" r="9" fill="#17191e"/><text x="278" y="424" class="num" text-anchor="middle">7</text>
  <text x="278" y="404" class="lbl" text-anchor="middle">results</text>
  <line x1="236" y1="456" x2="315" y2="456" class="flow" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="278" y="448" class="lbl" text-anchor="middle">approvals</text>
  <!-- 8: open fix PR -->
  <line x1="870" y1="450" x2="965" y2="450" class="flow" marker-end="url(#arr)"/>
  <circle cx="928" cy="450" r="9" fill="#17191e"/><text x="928" y="454" class="num" text-anchor="middle">8</text>

  <!-- ================= delivery ================= -->
  <line x1="40" y1="656" x2="1160" y2="656" stroke="#17191e"/>
  <text x="40" y="680" class="zone" style="fill:#17191e">DELIVERY · GITOPS</text>
  <rect x="48" y="696" width="160" height="58" rx="3" class="card"/>
  <text x="62" y="720" class="chip" font-size="13" font-weight="600">git push</text>
  <text x="62" y="740" class="s" font-size="11">to main</text>
  <rect x="236" y="696" width="160" height="58" rx="3" class="card"/>
  <text x="250" y="720" class="chip" font-size="13" font-weight="600">GitHub Actions</text>
  <text x="250" y="740" class="s" font-size="11">tests + red-team suite</text>
  <rect x="424" y="696" width="160" height="58" rx="3" class="card"/>
  <text x="438" y="720" class="chip" font-size="13" font-weight="600">Trivy</text>
  <text x="438" y="740" class="s" font-size="11">HIGH/CRITICAL = stop</text>
  <rect x="612" y="696" width="160" height="58" rx="3" class="card"/>
  <text x="626" y="720" class="chip" font-size="13" font-weight="600">GHCR</text>
  <text x="626" y="740" class="s" font-size="11">image tag = commit SHA</text>
  <rect x="800" y="696" width="160" height="58" rx="3" class="card"/>
  <text x="814" y="720" class="chip" font-size="13" font-weight="600">Helm values</text>
  <text x="814" y="740" class="s" font-size="11">tag pinned in Git</text>
  <rect x="988" y="696" width="164" height="58" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="1002" y="720" class="chip" font-size="13" font-weight="600" style="fill:#1f6b47">ArgoCD</text>
  <text x="1002" y="740" class="s" font-size="11">syncs the cluster</text>
  <line x1="208" y1="725" x2="233" y2="725" class="flow" marker-end="url(#arr)"/>
  <line x1="396" y1="725" x2="421" y2="725" class="flow" marker-end="url(#arr)"/>
  <line x1="584" y1="725" x2="609" y2="725" class="flow" marker-end="url(#arr)"/>
  <line x1="772" y1="725" x2="797" y2="725" class="flow" marker-end="url(#arr)"/>
  <line x1="960" y1="725" x2="985" y2="725" class="flow" marker-end="url(#arr)"/>
  <path d="M1070,696 L1070,672 L860,672 L860,633" fill="none" stroke="#1f6b47" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="1078" y="686" class="ns" style="fill:#1f6b47">deploys</text>
  <text x="40" y="784" class="s">A red test or a HIGH/CRITICAL image finding stops the pipeline: no image, nothing to deploy. Secrets are in Git only as Sealed Secrets, which only the cluster can unlock.</text>
</svg>
