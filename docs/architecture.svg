<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t d">
  <title id="t">Sentinel architecture</title>
  <desc id="d">A pull request on GitHub sends a signed webhook to the API on a k3s cluster on an Azure VM. The API queues a job in Redis. The worker runs LangGraph agents: scanners run as sandboxed Kubernetes Jobs, the AI triages through an LLM router, a policy layer applies guardrails, and a report is posted on the PR. Results go to Supabase and a Next.js dashboard, where a human can request and approve a fix, which is verified in a sandbox before a fix PR is opened. Delivery: GitHub Actions tests, Trivy image scan, GHCR, a pinned tag in Git, and ArgoCD sync.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c0531f" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d93"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b47"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #17191e; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; }
      .h { font-size: 15px; font-weight: 600; }
      .s { fill: #62666f; font-size: 11.5px; }
      .zone { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #62666f; font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; }
      .ns { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #8a8d93; font-size: 10.5px; }
      .chip { font-size: 12px; font-weight: 500; }
      .chipi { font-size: 12px; font-weight: 600; fill: #fffefb; }
      .num { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #fffefb; font-size: 11.5px; font-weight: 700; }
      .card { fill: #fffefb; stroke: #17191e; stroke-width: 1; }
      .soft { fill: #fffefb; stroke: #c9c5ba; stroke-width: 1; }
      .flow { fill: none; stroke: #17191e; stroke-width: 1.5; }
      .step { fill: none; stroke: #8a8d93; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="830" fill="#f6f4ee"/>

  <!-- title + legend -->
  <text x="40" y="48" class="mono" font-size="11.5" font-weight="600" letter-spacing="2.4" fill="#1f6b47">SENTINEL · ARCHITECTURE</text>
  <text x="40" y="82" class="serif" font-size="27">From a pull request to a security review, and back</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#17191e" stroke-width="1"/>
  <g transform="translate(724,42)">
    <rect x="0" y="0" width="16" height="12" fill="url(#hatch)" stroke="#c0531f"/>
    <text x="24" y="10.5" class="s">untrusted input</text>
    <rect x="128" y="0" width="16" height="12" fill="#17191e"/>
    <text x="152" y="10.5" class="s">AI step</text>
    <rect x="214" y="0" width="16" height="12" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="238" y="10.5" class="s">sandboxed</text>
    <line x1="314" y1="6" x2="344" y2="6" class="flow" marker-end="url(#arr)"/>
    <text x="354" y="10.5" class="s">a PR's path</text>
  </g>

  <!-- ================= GitHub ================= -->
  <text x="40" y="132" class="zone">GITHUB</text>
  <line x1="40" y1="140" x2="224" y2="140" stroke="#dedbd2"/>

  <rect x="48" y="156" width="168" height="62" rx="3" fill="url(#hatch)" stroke="#c0531f"/>
  <rect x="48" y="156" width="168" height="62" rx="3" fill="#fffefb" opacity="0.72"/>
  <text x="62" y="182" class="h">Pull request</text>
  <text x="62" y="202" class="s" style="fill:#9a3f16">untrusted code</text>

  <rect x="48" y="242" width="168" height="62" rx="3" class="card"/>
  <text x="62" y="268" class="h">GitHub App</text>
  <text x="62" y="288" class="s">HMAC-signed webhook</text>
  <line x1="132" y1="218" x2="132" y2="240" class="step" marker-end="url(#arrm)"/>

  <rect x="48" y="442" width="168" height="62" rx="3" class="card"/>
  <text x="62" y="468" class="h">PR comment</text>
  <text x="62" y="488" class="s">escaped report, 1 per PR</text>

  <rect x="48" y="532" width="168" height="62" rx="3" class="card"/>
  <text x="62" y="558" class="h">Fix PR</text>
  <text x="62" y="578" class="s">after human approval</text>

  <!-- ================= Azure VM / k3s ================= -->
  <rect x="262" y="114" width="640" height="516" rx="4" fill="#efece4" stroke="#17191e"/>
  <text x="280" y="138" class="zone" style="fill:#17191e">AZURE VM · K3S</text>
  <text x="884" y="138" class="s" text-anchor="end">Terraform · Helm · ArgoCD</text>

  <!-- namespace sentinel -->
  <rect x="282" y="152" width="600" height="104" rx="3" fill="none" stroke="#b9b5aa" stroke-dasharray="3 3"/>
  <text x="294" y="170" class="ns">namespace sentinel</text>

  <rect x="298" y="180" width="170" height="62" rx="3" class="card"/>
  <text x="312" y="206" class="h">Traefik + TLS</text>
  <text x="312" y="226" class="s">cert-manager, HTTPS</text>

  <rect x="500" y="180" width="170" height="62" rx="3" class="card"/>
  <text x="514" y="206" class="h">API · FastAPI</text>
  <text x="514" y="226" class="s">verify, dedupe, queue</text>

  <rect x="702" y="180" width="164" height="62" rx="3" class="card"/>
  <text x="716" y="206" class="h">Redis</text>
  <text x="716" y="226" class="s">job queue · BLMOVE</text>

  <line x1="468" y1="211" x2="498" y2="211" class="flow" marker-end="url(#arr)"/>
  <line x1="670" y1="211" x2="700" y2="211" class="flow" marker-end="url(#arr)"/>

  <!-- namespace sentinel-scans -->
  <rect x="282" y="272" width="600" height="344" rx="3" fill="none" stroke="#b9b5aa" stroke-dasharray="3 3"/>
  <text x="294" y="290" class="ns">namespace sentinel-scans</text>

  <!-- worker -->
  <rect x="298" y="300" width="568" height="188" rx="3" class="card"/>
  <text x="314" y="326" class="h">Worker · LangGraph agents</text>
  <text x="850" y="326" class="s" text-anchor="end">RBAC: may only create Jobs</text>

  <text x="314" y="352" class="ns">scan graph</text>
  <g>
    <rect x="314" y="360" width="96" height="36" rx="2" class="soft"/>
    <text x="362" y="383" class="chip" text-anchor="middle">plan</text>
    <rect x="424" y="360" width="96" height="36" rx="2" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="472" y="383" class="chip" text-anchor="middle" style="fill:#1f6b47">4 scanners</text>
    <rect x="534" y="360" width="96" height="36" rx="2" fill="#17191e"/>
    <text x="582" y="383" class="chipi" text-anchor="middle">AI triage</text>
    <rect x="644" y="360" width="96" height="36" rx="2" class="soft"/>
    <text x="692" y="383" class="chip" text-anchor="middle">policy</text>
    <rect x="754" y="360" width="96" height="36" rx="2" class="soft"/>
    <text x="802" y="383" class="chip" text-anchor="middle">report</text>
    <line x1="410" y1="378" x2="422" y2="378" class="step" marker-end="url(#arrm)"/>
    <line x1="520" y1="378" x2="532" y2="378" class="step" marker-end="url(#arrm)"/>
    <line x1="630" y1="378" x2="642" y2="378" class="step" marker-end="url(#arrm)"/>
    <line x1="740" y1="378" x2="752" y2="378" class="step" marker-end="url(#arrm)"/>
  </g>

  <text x="314" y="424" class="ns">fix graph</text>
  <g>
    <rect x="314" y="432" width="120" height="36" rx="2" fill="#17191e"/>
    <text x="374" y="455" class="chipi" text-anchor="middle">AI fix</text>
    <rect x="450" y="432" width="120" height="36" rx="2" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="510" y="455" class="chip" text-anchor="middle" style="fill:#1f6b47">sandbox verify</text>
    <rect x="586" y="432" width="120" height="36" rx="2" fill="#fffefb" stroke="#17191e" stroke-width="1.6"/>
    <text x="646" y="455" class="chip" text-anchor="middle" font-weight="600">human approval</text>
    <rect x="722" y="432" width="128" height="36" rx="2" class="soft"/>
    <text x="786" y="455" class="chip" text-anchor="middle">open fix PR</text>
    <line x1="434" y1="450" x2="448" y2="450" class="step" marker-end="url(#arrm)"/>
    <line x1="570" y1="450" x2="584" y2="450" class="step" marker-end="url(#arrm)"/>
    <line x1="706" y1="450" x2="720" y2="450" class="step" marker-end="url(#arrm)"/>
  </g>

  <!-- jobs -->
  <rect x="298" y="506" width="568" height="98" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="314" y="528" font-size="12" font-weight="600" style="fill:#1f6b47">Kubernetes Jobs · gVisor · read-only code · default-deny network</text>
  <g>
    <rect x="314" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
    <text x="364" y="562" class="chip mono" text-anchor="middle">semgrep</text>
    <rect x="422" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
    <text x="472" y="562" class="chip mono" text-anchor="middle">trivy</text>
    <rect x="530" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
    <text x="580" y="562" class="chip mono" text-anchor="middle">gitleaks</text>
    <rect x="638" y="540" width="100" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
    <text x="688" y="562" class="chip mono" text-anchor="middle">checkov</text>
    <rect x="746" y="540" width="104" height="34" rx="2" fill="#fffefb" stroke="#1f6b47"/>
    <text x="798" y="562" class="chip mono" text-anchor="middle">git apply</text>
  </g>
  <text x="314" y="594" class="s" font-size="11">Semgrep rules and the Trivy DB download: HTTPS out only. Everything else: no network.</text>
  <line x1="472" y1="488" x2="472" y2="504" class="flow" marker-end="url(#arr)"/>
  <line x1="580" y1="488" x2="580" y2="504" class="flow" marker-end="url(#arr)"/>

  <!-- ================= managed services ================= -->
  <text x="940" y="132" class="zone">MANAGED SERVICES</text>
  <line x1="940" y1="140" x2="1160" y2="140" stroke="#dedbd2"/>

  <rect x="948" y="156" width="204" height="82" rx="3" fill="#17191e"/>
  <text x="962" y="182" class="h" style="fill:#fffefb">LLM router</text>
  <text x="962" y="202" class="s" style="fill:#c9c5ba">Gemini → Groq fallback</text>
  <text x="962" y="220" class="s" style="fill:#c9c5ba">guardrails in plain Python</text>

  <rect x="948" y="256" width="204" height="82" rx="3" class="card"/>
  <text x="962" y="282" class="h">Langfuse</text>
  <text x="962" y="302" class="s">tokens, cost, fallbacks</text>
  <text x="962" y="320" class="s">sizes only, never code</text>
  <line x1="1050" y1="238" x2="1050" y2="254" class="step" stroke-dasharray="3 3" marker-end="url(#arrm)"/>

  <rect x="948" y="356" width="204" height="82" rx="3" class="card"/>
  <text x="962" y="382" class="h">Supabase</text>
  <text x="962" y="402" class="s">Postgres, row-level security</text>
  <text x="962" y="420" class="s">GitHub OAuth</text>

  <rect x="948" y="456" width="204" height="82" rx="3" class="card"/>
  <text x="962" y="482" class="h">Dashboard</text>
  <text x="962" y="502" class="s">Next.js on Vercel</text>
  <text x="962" y="520" class="s">request + approve fixes</text>
  <line x1="1050" y1="438" x2="1050" y2="454" class="step" marker-end="url(#arrm)" marker-start="url(#arrm)"/>

  <text x="948" y="580" class="s">Free tiers, no credit card.</text>
  <text x="948" y="598" class="s">≈ $0.004 of LLM tokens per PR scan.</text>

  <!-- ================= PR path (numbered) ================= -->
  <path d="M216,273 C256,273 258,211 296,211" class="flow" marker-end="url(#arr)"/>
  <path d="M784,242 L784,298" class="flow" marker-end="url(#arr)"/>
  <path d="M866,378 C908,378 908,197 946,197" class="flow" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M298,378 C258,378 258,473 218,473" class="flow" marker-end="url(#arr)"/>
  <path d="M866,452 C908,452 908,397 946,397" class="flow" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M298,456 C262,456 262,563 218,563" class="flow" marker-end="url(#arr)"/>

  <g>
    <circle cx="254" cy="242" r="10" fill="#17191e"/><text x="254" y="246" class="num" text-anchor="middle">1</text>
    <circle cx="685" cy="194" r="10" fill="#17191e"/><text x="685" y="198" class="num" text-anchor="middle">2</text>
    <circle cx="802" cy="268" r="10" fill="#17191e"/><text x="802" y="272" class="num" text-anchor="middle">3</text>
    <circle cx="526" cy="496" r="10" fill="#17191e"/><text x="526" y="500" class="num" text-anchor="middle">4</text>
    <circle cx="907" cy="290" r="10" fill="#17191e"/><text x="907" y="294" class="num" text-anchor="middle">5</text>
    <circle cx="258" cy="426" r="10" fill="#17191e"/><text x="258" y="430" class="num" text-anchor="middle">6</text>
    <circle cx="907" cy="424" r="10" fill="#17191e"/><text x="907" y="428" class="num" text-anchor="middle">7</text>
    <circle cx="262" cy="520" r="10" fill="#17191e"/><text x="262" y="524" class="num" text-anchor="middle">8</text>
  </g>

  <!-- ================= delivery ================= -->
  <line x1="40" y1="656" x2="1160" y2="656" stroke="#17191e"/>
  <text x="40" y="680" class="zone" style="fill:#17191e">DELIVERY · GITOPS</text>
  <g>
    <rect x="48" y="696" width="160" height="58" rx="3" class="card"/>
    <text x="62" y="720" class="chip" font-size="13" font-weight="600">git push</text>
    <text x="62" y="740" class="s" font-size="11">to main</text>

    <rect x="236" y="696" width="160" height="58" rx="3" class="card"/>
    <text x="250" y="720" class="chip" font-size="13" font-weight="600">GitHub Actions</text>
    <text x="250" y="740" class="s" font-size="11">tests + red-team suite</text>

    <rect x="424" y="696" width="160" height="58" rx="3" class="card"/>
    <text x="438" y="720" class="chip" font-size="13" font-weight="600">Trivy</text>
    <text x="438" y="740" class="s" font-size="11">HIGH/CRITICAL = stop</text>

    <rect x="612" y="696" width="160" height="58" rx="3" class="card"/>
    <text x="626" y="720" class="chip" font-size="13" font-weight="600">GHCR</text>
    <text x="626" y="740" class="s" font-size="11">image tag = commit SHA</text>

    <rect x="800" y="696" width="160" height="58" rx="3" class="card"/>
    <text x="814" y="720" class="chip" font-size="13" font-weight="600">Helm values</text>
    <text x="814" y="740" class="s" font-size="11">tag pinned in Git</text>

    <rect x="988" y="696" width="164" height="58" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="1002" y="720" class="chip" font-size="13" font-weight="600" style="fill:#1f6b47">ArgoCD</text>
    <text x="1002" y="740" class="s" font-size="11">syncs the cluster</text>

    <line x1="208" y1="725" x2="234" y2="725" class="flow" marker-end="url(#arr)"/>
    <line x1="396" y1="725" x2="422" y2="725" class="flow" marker-end="url(#arr)"/>
    <line x1="584" y1="725" x2="610" y2="725" class="flow" marker-end="url(#arr)"/>
    <line x1="772" y1="725" x2="798" y2="725" class="flow" marker-end="url(#arr)"/>
    <line x1="960" y1="725" x2="986" y2="725" class="flow" marker-end="url(#arr)"/>
  </g>
  <text x="40" y="784" class="s">A red test or a HIGH/CRITICAL image finding stops the pipeline: no image, nothing to deploy. Secrets are in Git only as Sealed Secrets, which only the cluster can unlock.</text>
  <path d="M1070,696 C1070,664 900,668 870,632" fill="none" stroke="#1f6b47" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
</svg>
