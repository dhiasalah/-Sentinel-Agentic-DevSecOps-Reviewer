<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1250" width="1320" height="1250" role="img" aria-labelledby="t d">
  <title id="t">Sentinel network map</title>
  <desc id="d">The Azure firewall lets in SSH from one address and web traffic on ports 80 and 443; everything else is dropped. Inside the k3s cluster, Traefik forwards webhooks to the API on port 8000; the API puts jobs in Redis and the worker takes them, on port 6379; nothing may connect to the worker; the worker asks the Kubernetes API to start scanner Jobs and exchanges files with them on a shared disk. Scanner Jobs run in a gVisor sandbox with no secrets: Semgrep and the Trivy database update may use DNS and HTTPS to public IPs, the other scanners have no network. The worker's outbound traffic is not restricted yet. A legend at the bottom explains every shape, colour and rule.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c0531f" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b47"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0531f"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d93"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #17191e; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; }
      .h { font-size: 14.5px; font-weight: 600; }
      .s { fill: #62666f; font-size: 11.5px; }
      .k { fill: #17191e; font-size: 12.5px; }
      .zone { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #62666f; font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; }
      .ns { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #8a8d93; font-size: 10.5px; }
      .pill { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .note { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; font-size: 10.5px; fill: #17191e; }
      .pw { fill: #fffefb; }
      .card { fill: #fffefb; stroke: #17191e; stroke-width: 1; }
      .nsbox { fill: none; stroke: #b9b5aa; stroke-dasharray: 3 3; }
      .flow { fill: none; stroke: #17191e; stroke-width: 1.6; }
      .gate { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; fill: #fffefb; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1320" height="1250" fill="#f6f4ee"/>

  <!-- title -->
  <text x="40" y="48" class="mono" font-size="11.5" font-weight="600" letter-spacing="2.4" fill="#1f6b47">SENTINEL · NETWORK MAP</text>
  <text x="40" y="82" class="serif" font-size="27">Who may talk to whom, from the internet to the scanners</text>
  <line x1="40" y1="96" x2="1280" y2="96" stroke="#17191e"/>

  <!-- ================= inbound ================= -->
  <text x="36" y="132" class="zone">INTERNET · IN</text>

  <rect x="36" y="150" width="180" height="56" rx="3" class="card"/>
  <text x="50" y="172" class="h">Your laptop</text>
  <text x="50" y="191" class="s">you, running kubectl</text>
  <text x="36" y="224" class="s" font-size="10.5">allowed from your one IP only</text>

  <rect x="36" y="410" width="180" height="60" rx="3" class="card"/>
  <text x="50" y="432" class="h">GitHub, Let's Encrypt</text>
  <text x="50" y="451" class="s">webhooks + HTTPS</text>
  <text x="50" y="465" class="s">certificate check</text>

  <rect x="36" y="620" width="180" height="56" rx="3" fill="url(#hatch)" stroke="#c0531f"/>
  <rect x="36" y="620" width="180" height="56" rx="3" fill="#fffefb" opacity="0.72"/>
  <text x="50" y="642" class="h">Anyone else</text>
  <text x="50" y="661" class="s" style="fill:#9a3f16">any other port: dropped</text>

  <!-- NSG wall -->
  <rect x="244" y="140" width="20" height="706" fill="#17191e"/>
  <text x="254" y="132" class="pill" text-anchor="middle">FIREWALL</text>

  <line x1="216" y1="178" x2="307" y2="178" class="flow" marker-end="url(#arr)"/>
  <rect x="234" y="168" width="40" height="20" rx="2" fill="#1f6b47"/><text x="254" y="182" class="gate" text-anchor="middle">22</text>

  <line x1="216" y1="440" x2="339" y2="440" class="flow" marker-end="url(#arr)"/>
  <rect x="226" y="430" width="56" height="20" rx="2" fill="#1f6b47"/><text x="254" y="444" class="gate" text-anchor="middle">443·80</text>

  <line x1="216" y1="648" x2="232" y2="648" stroke="#c0531f" stroke-width="1.6"/>
  <rect x="234" y="638" width="40" height="20" rx="2" fill="#c0531f"/><text x="254" y="652" class="gate" text-anchor="middle">✕</text>

  <!-- ================= VM ================= -->
  <rect x="292" y="112" width="808" height="746" rx="4" fill="#efece4" stroke="#17191e"/>
  <text x="308" y="134" class="zone" style="fill:#17191e">AZURE VM (THE SERVER)</text>
  <text x="1084" y="134" class="s" text-anchor="end">Ubuntu 24.04 · built by Terraform</text>

  <rect x="310" y="150" width="150" height="56" rx="3" class="card"/>
  <text x="324" y="172" class="h">SSH server :22</text>
  <text x="324" y="191" class="s">login with a key only</text>

  <!-- k3s -->
  <rect x="310" y="220" width="776" height="626" rx="4" fill="#f6f4ee" stroke="#17191e"/>
  <text x="1070" y="238" class="zone" text-anchor="end" style="fill:#17191e">K3S (THE KUBERNETES CLUSTER)</text>

  <!-- control row -->
  <rect x="342" y="248" width="166" height="74" rx="3" class="card"/>
  <text x="354" y="270" class="h">Sealed Secrets</text>
  <text x="354" y="289" class="s">unlocks the secrets</text>
  <text x="354" y="305" class="s">that are stored in Git</text>

  <rect x="572" y="248" width="176" height="74" rx="3" fill="#17191e"/>
  <text x="584" y="270" class="h" style="fill:#fffefb">Cluster API :6443</text>
  <text x="584" y="289" class="s" style="fill:#c9c5ba">the cluster's brain;</text>
  <text x="584" y="305" class="s" style="fill:#c9c5ba">secrets encrypted on disk</text>

  <rect x="812" y="248" width="116" height="74" rx="3" class="card"/>
  <text x="824" y="270" class="h">ArgoCD</text>
  <text x="824" y="289" class="s">deploys what</text>
  <text x="824" y="305" class="s">Git describes</text>

  <rect x="940" y="248" width="130" height="74" rx="3" class="card"/>
  <text x="952" y="270" class="h">cert-manager</text>
  <text x="952" y="289" class="s">gets the HTTPS</text>
  <text x="952" y="305" class="s">certificate</text>

  <path d="M460,178 L660,178 L660,245" class="flow" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="476" y="170" class="note">SSH tunnel: kubectl reaches the cluster API</text>
  <line x1="508" y1="285" x2="569" y2="285" class="flow" marker-end="url(#arr)"/>
  <line x1="812" y1="285" x2="751" y2="285" class="flow" marker-end="url(#arr)"/>

  <!-- namespaces -->
  <rect x="330" y="350" width="190" height="484" rx="3" class="nsbox"/>
  <text x="342" y="368" class="ns">namespace kube-system</text>
  <rect x="560" y="350" width="200" height="484" rx="3" class="nsbox"/>
  <text x="572" y="368" class="ns">namespace sentinel</text>
  <rect x="800" y="350" width="270" height="484" rx="3" class="nsbox"/>
  <text x="812" y="368" class="ns">namespace sentinel-scans</text>

  <rect x="342" y="400" width="166" height="80" rx="3" class="card"/>
  <text x="354" y="422" class="h">Traefik</text>
  <text x="354" y="441" class="s">the only public door;</text>
  <text x="354" y="457" class="s">lets in only the path</text>
  <text x="354" y="473" class="s mono" font-size="10.5">/webhooks/github</text>

  <rect x="342" y="722" width="166" height="70" rx="3" class="card"/>
  <text x="354" y="744" class="h">CoreDNS</text>
  <text x="354" y="763" class="s">the cluster's phone book:</text>
  <text x="354" y="779" class="s">names → addresses</text>

  <rect x="572" y="400" width="176" height="80" rx="3" class="card"/>
  <text x="584" y="422" class="h">API (FastAPI)</text>
  <text x="584" y="441" class="s">checks GitHub's signature,</text>
  <text x="584" y="457" class="s">puts a job in Redis;</text>
  <text x="584" y="473" class="s">never touches the code</text>

  <rect x="572" y="600" width="176" height="74" rx="3" class="card"/>
  <text x="584" y="622" class="h">Redis</text>
  <text x="584" y="641" class="s">the job queue between</text>
  <text x="584" y="657" class="s">the API and the worker</text>

  <rect x="812" y="400" width="246" height="80" rx="3" class="card"/>
  <text x="824" y="422" class="h">Worker (the AI agents)</text>
  <text x="824" y="441" class="s">takes jobs from Redis, holds the keys,</text>
  <text x="824" y="457" class="s">calls the AI, posts the PR comment;</text>
  <text x="824" y="473" class="s">may only start Jobs (RBAC)</text>

  <rect x="812" y="550" width="246" height="92" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="824" y="571" class="pill" style="fill:#1f6b47">SCANNER JOBS · NO NETWORK</text>
  <text x="824" y="591" class="h">gitleaks · checkov · trivy</text>
  <text x="824" y="609" class="h">git apply (fix sandbox)</text>
  <text x="824" y="628" class="s">gVisor sandbox · no secrets</text>

  <rect x="812" y="700" width="246" height="92" rx="3" fill="#e4eee6" stroke="#1f6b47"/>
  <text x="824" y="721" class="pill" style="fill:#1f6b47">SCANNER JOBS · DOWNLOADS ONLY</text>
  <text x="824" y="741" class="h">semgrep · trivy DB update</text>
  <text x="824" y="760" class="s">gVisor sandbox · no secrets</text>
  <text x="824" y="777" class="s">need rules / CVE database</text>

  <!-- ===== allowed connections ===== -->
  <line x1="508" y1="440" x2="569" y2="440" class="flow" marker-end="url(#arr)"/>
  <rect x="514" y="418" width="40" height="15" rx="2" fill="#17191e"/><text x="534" y="429" class="pill pw" text-anchor="middle">8000</text>
  <circle cx="534" cy="456" r="8" fill="#17191e"/><text x="534" y="460" class="pill pw" text-anchor="middle">5</text>

  <line x1="660" y1="480" x2="660" y2="597" class="flow" marker-end="url(#arr)"/>
  <rect x="666" y="520" width="40" height="15" rx="2" fill="#17191e"/><text x="686" y="531" class="pill pw" text-anchor="middle">6379</text>
  <circle cx="660" cy="545" r="8" fill="#17191e"/><text x="660" y="549" class="pill pw" text-anchor="middle">4</text>
  <text x="668" y="566" class="note">puts a job</text>

  <path d="M812,466 L780,466 L780,640 L751,640" class="flow" marker-end="url(#arr)"/>
  <rect x="760" y="566" width="40" height="15" rx="2" fill="#17191e"/><text x="780" y="577" class="pill pw" text-anchor="middle">6379</text>
  <circle cx="780" cy="600" r="8" fill="#17191e"/><text x="780" y="604" class="pill pw" text-anchor="middle">4</text>
  <text x="742" y="696" class="note" text-anchor="end">worker takes the job</text>
  <line x1="745" y1="692" x2="776" y2="650" stroke="#8a8d93" stroke-width="1"/>

  <path d="M900,400 L900,386 L700,386 L700,325" class="flow" marker-end="url(#arr)"/>
  <text x="708" y="382" class="note">starts scanner Jobs (RBAC)</text>

  <line x1="935" y1="482" x2="935" y2="548" stroke="#8a8d93" stroke-width="1.4" stroke-dasharray="3 3" marker-start="url(#arrm)" marker-end="url(#arrm)"/>
  <text x="944" y="506" class="note">shared disk:</text>
  <text x="944" y="520" class="note">code in, results out</text>
  <text x="944" y="534" class="note">(no network)</text>

  <line x1="812" y1="760" x2="511" y2="760" stroke="#1f6b47" stroke-width="1.6" marker-end="url(#arrg)"/>
  <rect x="640" y="752" width="28" height="15" rx="2" fill="#1f6b47"/><text x="654" y="763" class="pill pw" text-anchor="middle">53</text>
  <circle cx="690" cy="760" r="8" fill="#17191e"/><text x="690" y="764" class="pill pw" text-anchor="middle">2</text>
  <text x="560" y="784" class="note">looks up the download server</text>

  <!-- ===== blocked ===== -->
  <line x1="751" y1="414" x2="770" y2="414" stroke="#c0531f" stroke-width="1.6"/>
  <text x="786" y="419" class="pill" text-anchor="middle" style="fill:#c0531f" font-size="13">✕</text>
  <circle cx="1046" cy="400" r="8" fill="#17191e"/><text x="1046" y="404" class="pill pw" text-anchor="middle">3</text>
  <circle cx="1046" cy="550" r="8" fill="#17191e"/><text x="1046" y="554" class="pill pw" text-anchor="middle">1</text>
  <line x1="1058" y1="596" x2="1100" y2="596" stroke="#c0531f" stroke-width="1.6"/>
  <text x="1112" y="601" class="pill" text-anchor="middle" style="fill:#c0531f" font-size="13">✕</text>
  <circle cx="1046" cy="700" r="8" fill="#17191e"/><text x="1046" y="704" class="pill pw" text-anchor="middle">2</text>

  <!-- ================= outbound ================= -->
  <text x="1130" y="132" class="zone">INTERNET · OUT</text>

  <rect x="1130" y="256" width="160" height="58" rx="3" class="card"/>
  <text x="1142" y="278" class="h" font-size="13">GitHub, Let's Encrypt</text>
  <text x="1142" y="297" class="s">Git pulls, certificates</text>
  <line x1="1070" y1="285" x2="1127" y2="285" class="flow" marker-end="url(#arr)"/>

  <rect x="1130" y="410" width="160" height="60" rx="3" fill="url(#hatch)" stroke="#c0531f"/>
  <rect x="1130" y="410" width="160" height="60" rx="3" fill="#fffefb" opacity="0.72"/>
  <text x="1142" y="433" class="h" font-size="13">LLMs, GitHub API,</text>
  <text x="1142" y="452" class="h" font-size="13">Supabase, Langfuse</text>
  <line x1="1058" y1="440" x2="1127" y2="440" stroke="#c0531f" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrr)"/>
  <rect x="1066" y="418" width="30" height="15" rx="2" fill="#c0531f"/><text x="1081" y="429" class="pill pw" text-anchor="middle">443</text>
  <text x="1130" y="488" class="s" style="fill:#9a3f16">open to any server today:</text>
  <text x="1130" y="504" class="s" style="fill:#9a3f16">should be limited (known limit)</text>

  <text x="1130" y="592" class="s" style="fill:#9a3f16">nothing goes in or out</text>
  <text x="1130" y="608" class="s" style="fill:#9a3f16">of these Jobs</text>

  <rect x="1130" y="720" width="160" height="60" rx="3" class="card"/>
  <text x="1142" y="742" class="h" font-size="13">Rule + CVE feeds</text>
  <text x="1142" y="761" class="s">Semgrep rules, Trivy DB</text>
  <line x1="1058" y1="750" x2="1127" y2="750" stroke="#1f6b47" stroke-width="1.6" marker-end="url(#arrg)"/>
  <rect x="1066" y="728" width="30" height="15" rx="2" fill="#1f6b47"/><text x="1081" y="739" class="pill pw" text-anchor="middle">443</text>
  <text x="1130" y="798" class="s">public addresses only</text>

  <!-- ================= how to read ================= -->
  <line x1="40" y1="884" x2="1280" y2="884" stroke="#17191e"/>
  <text x="40" y="910" class="zone" style="fill:#17191e">HOW TO READ THIS MAP</text>

  <!-- column 1: shapes -->
  <g transform="translate(40,930)">
    <rect x="0" y="0" width="12" height="24" fill="#17191e"/>
    <text x="40" y="10" class="k">Black bar: the Azure firewall. Green tags are the only ports it lets in;</text>
    <text x="40" y="26" class="k">the rust ✕ means every other port is dropped.</text>

    <rect x="0" y="44" width="28" height="18" rx="2" fill="#efece4" stroke="#17191e"/>
    <text x="40" y="57" class="k">Big outlined boxes: the server (Azure VM) and, inside it, the k3s cluster.</text>

    <rect x="0" y="78" width="28" height="18" rx="2" class="nsbox"/>
    <text x="40" y="91" class="k">Dashed boxes: namespaces, separate rooms in the cluster, one per level of trust.</text>

    <rect x="0" y="112" width="28" height="18" rx="2" class="card"/>
    <text x="40" y="125" class="k">White cards: programs that run all the time (pods).</text>

    <rect x="0" y="146" width="28" height="18" rx="2" fill="#e4eee6" stroke="#1f6b47"/>
    <text x="40" y="159" class="k">Green boxes: the scanner Jobs. Short-lived containers that check the PR's code</text>
    <text x="40" y="175" class="k">once, inside a gVisor sandbox, with no secrets, then stop.</text>

    <rect x="0" y="194" width="28" height="18" rx="2" fill="url(#hatch)" stroke="#c0531f"/>
    <text x="40" y="207" class="k">Hatched rust: traffic we don't trust or don't limit yet.</text>
  </g>

  <!-- column 2: lines + rules -->
  <g transform="translate(690,930)">
    <line x1="0" y1="6" x2="28" y2="6" class="flow" marker-end="url(#arr)"/>
    <text x="40" y="10" class="k">Solid arrow: an allowed connection, in that direction.</text>
    <rect x="0" y="18" width="28" height="13" rx="2" fill="#17191e"/><text x="14" y="28" class="pill pw" text-anchor="middle" font-size="9">8000</text>
    <text x="40" y="29" class="k">Black tag: the port (the numbered door) it uses.</text>

    <text x="8" y="55" class="pill" style="fill:#c0531f" font-size="14">✕</text>
    <text x="40" y="54" class="k">Rust ✕: a connection that a rule blocks.</text>

    <line x1="0" y1="72" x2="28" y2="72" stroke="#8a8d93" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="40" y="76" class="k">Grey dashed: no network, just files shared on a disk.</text>

    <line x1="0" y1="94" x2="28" y2="94" stroke="#c0531f" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="40" y="98" class="k">Rust dashed: allowed today, but should be limited.</text>

    <text x="0" y="128" class="pill" style="fill:#17191e">THE 5 RULES INSIDE THE CLUSTER (NetworkPolicies)</text>
    <circle cx="8" cy="146" r="8" fill="#17191e"/><text x="8" y="150" class="pill pw" text-anchor="middle">1</text>
    <text x="24" y="151" class="k">Scanner Jobs may not talk to anyone, and no one to them.</text>
    <circle cx="8" cy="168" r="8" fill="#17191e"/><text x="8" y="172" class="pill pw" text-anchor="middle">2</text>
    <text x="24" y="173" class="k">Except Semgrep and the Trivy DB update: DNS, then HTTPS downloads.</text>
    <circle cx="8" cy="190" r="8" fill="#17191e"/><text x="8" y="194" class="pill pw" text-anchor="middle">3</text>
    <text x="24" y="195" class="k">Nothing may connect to the worker, which holds the keys.</text>
    <circle cx="8" cy="212" r="8" fill="#17191e"/><text x="8" y="216" class="pill pw" text-anchor="middle">4</text>
    <text x="24" y="217" class="k">Redis accepts only the API and the worker (port 6379).</text>
    <circle cx="8" cy="234" r="8" fill="#17191e"/><text x="8" y="238" class="pill pw" text-anchor="middle">5</text>
    <text x="24" y="239" class="k">The API accepts only Traefik (port 8000).</text>
  </g>

  <text x="40" y="1200" class="s" style="fill:#17191e">The idea: every door is closed unless something needs it. The scanners read attacker code, so they get the fewest doors of all.</text>
  <text x="40" y="1220" class="s">Scanner Jobs can never reach private networks or the cloud metadata address. Rules: deploy/helm/sentinel/templates/networkpolicy.yaml · firewall: infra/terraform/network.tf</text>
</svg>
